# Railway / Nixpacks Monorepo Deployment Config for PulseCord

[phases.setup]
nixPkgs = ['nodejs_20', 'openssl']

[phases.install]
cmds = [
  'npm install'
]

[phases.build]
cmds = [
  'cd server && npx prisma generate --schema=prisma/schema.postgresql.prisma',
  'cd client && npx vite build',
  'cd server && npx tsc'
]

[start]
cmd = 'node server/dist/index.js'
