# Railway / Nixpacks Monorepo Deployment Config for PulseCord

[phases.setup]
nixPkgs = ['nodejs_20', 'openssl']

[phases.install]
cmds = [
  'npm install'
]

[phases.build]
cmds = [
  'cd server && node ../node_modules/prisma/build/index.js generate --schema=prisma/schema.postgresql.prisma',
  'npm run build'
]

[start]
cmd = 'node server/dist/index.js'
